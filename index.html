<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapak Voucher Wi-Fi Fakri</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 350px; margin: 0 auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stok { background: #e3f2fd; color: #0d47a1; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
        button { background: #2e7d32; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; }
        #vcr-area { display: none; margin-top: 20px; padding-top: 15px; border-top: 2px dashed #ccc; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; }
        .kode { font-size: 22px; font-weight: bold; color: #d32f2f; background: #ffebee; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Lapak Voucher Wi-Fi Fakri</h2>
    <div class="stok">Sisa Stok: <span id="stok-count">Memuat...</span> Voucher</div>

    <button onclick="ambilVoucher()">🎟️ AMBIL 1 VOUCHER (Rp 3.000)</button>

    <div id="vcr-area">
        <p style="margin:0; font-size:14px; color:#555;">Scan QR Code untuk Login:</p>
        <div id="qrcode"></div>
        <p style="margin:5px 0 0 0; font-size:12px;">Kode Voucher:</p>
        <div class="kode" id="kode-voucher">-</div>
    </div>
</div>

<script>
    const SHEET_ID = '1HVV34-02cAfbKsDZeTPj2hDBxzVcQ8Yd9fhKvOZgPcI';
    // Menggunakan API GViz yang tidak butuh "Publikasikan ke web"
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let daftarVoucher = [];

    async function loadVouchersFromSheets() {
        try {
            const response = await fetch(GVIZ_URL);
            const data = await response.text();
            
            // Bersihkan format CSV dari Google Sheets
            daftarVoucher = data.split('\n')
                                .map(row => row.split(',')[0].replace(/"/g, '').trim())
                                .filter(v => v !== '');

            updateStok();
        } catch (error) {
            alert('Gagal memuat data! Pastikan di Google Sheets "Kelola Akses" sudah diatur ke "Siapa saja yang memiliki link".');
        }
    }

    function updateStok() {
        let terpakai = JSON.parse(localStorage.getItem('vcr_terpakai_fakri') || '[]');
        let sisa = daftarVoucher.length - terpakai.length;
        document.getElementById('stok-count').innerText = sisa > 0 ? sisa : 0;
    }

    function ambilVoucher() {
        let terpakai = JSON.parse(localStorage.getItem('vcr_terpakai_fakri') || '[]');
        let vcr = daftarVoucher.find(v => !terpakai.includes(v));

        if (!vcr) {
            alert('Stok Voucher Habis! Silakan Minta Isi Ulang.');
            return;
        }

        document.getElementById('kode-voucher').innerText = vcr;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: vcr, width: 160, height: 160 });
        document.getElementById('vcr-area').style.display = 'block';

        terpakai.push(vcr);
        localStorage.setItem('vcr_terpakai_fakri', JSON.stringify(terpakai));
        updateStok();
    }

    loadVouchersFromSheets();
</script>

</body>
</html>
