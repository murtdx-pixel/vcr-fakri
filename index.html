<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>btd Lapak Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-login { max-width: 400px; margin: 80px auto; border-radius: 12px; }
        .badge-role { font-size: 0.8rem; }
        .voucher-box { border: 2px dashed #0d6efd; background: #eef5ff; border-radius: 12px; padding: 20px; }
        .qr-img { width: 140px; height: 140px; border-radius: 8px; border: 1px solid #dee2e6; padding: 5px; background: #fff; }
    </style>
</head>
<body>

    <!-- SECTION 1: FORM LOGIN -->
    <div id="loginSection" class="container">
        <div class="card card-login shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="text-center fw-bold mb-1 text-primary">btd Lapak Voucher</h4>
                <p class="text-muted text-center small mb-4">Masuk ke Sistem Kasir & Reseller</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- SECTION 2: DASHBOARD -->
    <div id="dashboardSection" class="container my-4" style="display: none;">
        <!-- Header Info User -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <div>
                <h5 class="mb-0 fw-bold" id="displayName">Selamat Datang</h5>
                <span class="badge bg-primary badge-role" id="displayRole">Role</span>
                <span class="badge bg-secondary badge-role" id="displayServer">Server</span>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>

        <!-- Panel Konten Berdasarkan Role -->
        <div id="roleContent"></div>
    </div>

    <!-- MODAL POPUP VOUCHER -->
    <div class="modal fade" id="voucherModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Voucher WiFi Berhasil Diambil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="voucher-box mb-3">
                        <!-- QR Code -->
                        <div class="mb-3">
                            <img id="vQR" src="" alt="QR Code Voucher" class="qr-img shadow-sm">
                        </div>

                        <!-- Kode Voucher -->
                        <small class="text-muted d-block mb-1">KODE VOUCHER</small>
                        <h1 class="fw-bold text-primary mb-2" id="vKode" style="letter-spacing: 2px;">------</h1>

                        <div class="mb-3">
                            <span class="badge bg-success fs-6" id="vHarga">Rp -</span>
                        </div>

                        <!-- Tombol Aksi Cepat -->
                        <div class="d-flex justify-content-center gap-2 mt-3">
                            <button class="btn btn-sm btn-outline-primary fw-bold" onclick="copyVoucher()">
                                <i class="bi bi-clipboard"></i> Salin Kode
                            </button>
                            <button class="btn btn-sm btn-success fw-bold" onclick="shareWA()">
                                <i class="bi bi-whatsapp"></i> Kirim ke WA
                            </button>
                        </div>
                    </div>
                    <p class="text-muted small mb-0">Silakan scan QR atau masukkan kode voucher untuk login WiFi.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // WEB APP URL APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsn5YBWXUlvQC3KCOq6R5_U4_m5ZebzZ8rpL1RpKe2GdOxg5-YXeFyN2QzFCFIHAWJaw/exec";

        // Database User Sederhana
        const usersDB = [
            { username: "admin", pass: "admin123", role: "Super Admin", server: "ALL" },
            { username: "fakri", pass: "fakri123", role: "Reseller", server: "Fakri" },
            { username: "munzir", pass: "munzir123", role: "Reseller", server: "Munzir" },
            { username: "operator_f1", pass: "op123", role: "Operator", server: "Fakri", sold: 0 },
            { username: "operator_m1", pass: "op123", role: "Operator", server: "Munzir", sold: 0 }
        ];

        let currentUser = null;
        let activeVoucherCode = "";
        let activeVoucherPrice = "";

        // Login Process
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;

            const user = usersDB.find(x => x.username === u && x.pass === p);

            if (user) {
                currentUser = user;
                loadDashboard(user);
            } else {
                alert("Username atau Password salah!");
            }
        });

        function loadDashboard(user) {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("dashboardSection").style.display = "block";

            document.getElementById("displayName").innerText = "Halo, " + user.username;
            document.getElementById("displayRole").innerText = user.role;
            document.getElementById("displayServer").innerText = "Server: " + user.server;

            const contentDiv = document.getElementById("roleContent");

            if (user.role === "Operator") {
                contentDiv.innerHTML = `
                    <div class="row g-3 justify-content-center">
                        <div class="col-md-6">
                            <div class="card bg-success text-white border-0 shadow-sm mb-3">
                                <div class="card-body text-center">
                                    <h6>Total Voucher Terjual (Saya)</h6>
                                    <h2 class="fw-bold" id="opSold">${user.sold} Voucher</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card shadow-sm border-0">
                        <div class="card-body text-center p-5">
                            <h4>Menu Kasir Operator (${user.server})</h4>
                            <p class="text-muted">Klik tombol di bawah untuk mengeluarkan voucher dari stok reseller ${user.server}</p>
                            <button id="btnAmbil" onclick="ambilVoucher('${user.server}')" class="btn btn-lg btn-primary px-5 py-3 fw-bold shadow">
                                <i class="bi bi-qr-code"></i> AMBIL VOUCHER
                            </button>
                        </div>
                    </div>
                `;
            } else if (user.role === "Reseller") {
                contentDiv.innerHTML = `
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Dashboard Reseller (${user.server})</h5>
                            <p class="text-muted">Kelola stok voucher untuk operator ${user.server}.</p>
                        </div>
                    </div>
                `;
            } else {
                contentDiv.innerHTML = `
                    <div class="alert alert-info">Dashboard Super Admin: Kontrol transaksi seluruh server.</div>
                `;
            }
        }

        // FUNGSI AMBIL VOUCHER CEPAT DAN BEBAS ERROR CORS
        function ambilVoucher(serverOwner) {
            const btn = document.getElementById("btnAmbil");
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Memproses...`;

            // Menggunakan GET Request dengan timestamp untuk menghindari caching browser
            const targetUrl = `${WEB_APP_URL}?action=getVoucher&server=${encodeURIComponent(serverOwner)}&_=${new Date().getTime()}`;

            fetch(targetUrl)
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-qr-code"></i> AMBIL VOUCHER`;

                if (data.status === "success") {
                    activeVoucherCode = data.kode;
                    activeVoucherPrice = data.harga;

                    document.getElementById("vKode").innerText = data.kode;
                    document.getElementById("vHarga").innerText = "Rp " + data.harga;
                    
                    // QR Code Generator
                    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(data.kode);
                    document.getElementById("vQR").src = qrUrl;

                    currentUser.sold += 1;
                    document.getElementById("opSold").innerText = currentUser.sold + " Voucher";

                    var myModal = new bootstrap.Modal(document.getElementById('voucherModal'));
                    myModal.show();
                } else {
                    alert("Informasi: " + (data.message || "Stok voucher habis atau tidak ditemukan!"));
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-qr-code"></i> AMBIL VOUCHER`;
                alert("Terjadi kesalahan sistem. Silakan coba klik sekali lagi.");
                console.error("Detail Error:", err);
            });
        }

        // FUNGSI SALIN KODE VOUCHER
        function copyVoucher() {
            if (!activeVoucherCode) return;
            navigator.clipboard.writeText(activeVoucherCode).then(() => {
                alert("Kode Voucher (" + activeVoucherCode + ") berhasil disalin!");
            });
        }

        // FUNGSI KIRIM KE WHATSAPP
        function shareWA() {
            if (!activeVoucherCode) return;
            const pesan = `*BTD LAPAK VOUCHER*\n------------------------------\nBerikut Kode Voucher Hotspot Anda:\n\nKode / Password: *${activeVoucherCode}*\nHarga: Rp ${activeVoucherPrice}\n\nTerima kasih telah membeli!`;
            const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(pesan);
            window.open(waUrl, '_blank');
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
