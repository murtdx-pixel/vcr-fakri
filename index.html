<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapak Voucher Hotspot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-login { max-width: 400px; margin: 80px auto; border-radius: 12px; }
        .badge-role { font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- SECTION 1: FORM LOGIN -->
    <div id="loginSection" class="container">
        <div class="card card-login shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="text-center fw-bold mb-3">Lapak Voucher</h4>
                <p class="text-muted text-center small mb-4">Silakan login sesuai akun Anda</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- SECTION 2: DASHBOARD (AKAN TAMPIL SETELAH LOGIN) -->
    <div id="dashboardSection" class="container my-4" style="display: none;">
        <!-- Header Info User -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <div>
                <h5 class="mb-0 fw-bold" id="displayName">Selamat Datang</h5>
                <span class="badge bg-primary badge-role" id="displayRole">Role</span>
                <span class="badge bg-secondary badge-role" id="displayServer">Server</span>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
        </div>

        <!-- Panel Konten Berdasarkan Role -->
        <div id="roleContent">
            <!-- Konten dinamis akan di-inject lewat Javascript -->
        </div>
    </div>

    <script>
        // Data Dummy Akun untuk Pengujian Awal
        const usersDB = [
            { username: "admin", pass: "admin123", role: "Super Admin", server: "ALL" },
            { username: "fakri", pass: "fakri123", role: "Reseller", server: "Fakri" },
            { username: "munzir", pass: "munzir123", role: "Reseller", server: "Munzir" },
            { username: "operator_f1", pass: "op123", role: "Operator", server: "Fakri", stokQuota: 20, sold: 0 },
            { username: "operator_m1", pass: "op123", role: "Operator", server: "Munzir", stokQuota: 15, sold: 0 }
        ];

        // Proses Login
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;

            const user = usersDB.find(x => x.username === u && x.pass === p);

            if (user) {
                localStorage.setItem("sessionUser", JSON.stringify(user));
                loadDashboard(user);
            } else {
                alert("Username atau Password salah!");
            }
        });

        // Load Dashboard
        function loadDashboard(user) {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("dashboardSection").style.display = "block";

            document.getElementById("displayName").innerText = "Halo, " + user.username;
            document.getElementById("displayRole").innerText = user.role;
            document.getElementById("displayServer").innerText = "Server: " + user.server;

            const contentDiv = document.getElementById("roleContent");

            if (user.role === "Operator") {
                contentDiv.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="card bg-info text-white border-0 shadow-sm">
                                <div class="card-body">
                                    <h6>Sisa Kuota Stok Hari Ini</h6>
                                    <h2 class="fw-bold">${user.stokQuota} Voucher</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-success text-white border-0 shadow-sm">
                                <div class="card-body">
                                    <h6>Voucher Terjual (Saya)</h6>
                                    <h2 class="fw-bold">${user.sold} Voucher</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-4 shadow-sm border-0">
                        <div class="card-body text-center p-5">
                            <h4>Menu Kasir Operator</h4>
                            <p class="text-muted">Klik tombol di bawah untuk mengeluarkan kode voucher ke pelanggan</p>
                            <button class="btn btn-lg btn-primary px-5 py-3 fw-bold shadow">
                                <i class="bi bi-qr-code"></i> AMBIL VOUCHER
                            </button>
                        </div>
                    </div>
                `;
            } else if (user.role === "Reseller") {
                contentDiv.innerHTML = `
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="card bg-primary text-white border-0 shadow-sm">
                                <div class="card-body">
                                    <h6>Total Stok Server (${user.server})</h6>
                                    <h2 class="fw-bold">Memuat...</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3">Kelola / Isi Stok Operator</h5>
                            <button class="btn btn-success mb-3">+ Top-Up Stok ke Operator</button>
                            <p class="text-muted small">Daftar Rekap Penjualan Operator Bawaan Anda akan tampil di sini.</p>
                        </div>
                    </div>
                `;
            } else {
                contentDiv.innerHTML = `
                    <div class="alert alert-warning">Dashboard Super Admin: Menampilkan seluruh performa server Fakri & Munzir.</div>
                `;
            }
        }

        function logout() {
            localStorage.removeItem("sessionUser");
            location.reload();
        }
    </script>
</body>
</html>
