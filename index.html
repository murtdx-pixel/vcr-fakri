<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapak Voucher Wi-Fi Fakri</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; text-align: center; color: #333; }
        .card { background: white; max-width: 380px; margin: 0 auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 5px; color: #1e293b; font-size: 22px; }
        
        /* Dashboards & Info Boxes */
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .info-box { background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .info-box.stok-box { background: #eff6ff; border-color: #bfdbfe; grid-column: span 2; }
        .info-title { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: 0.5px; }
        .info-value { font-size: 18px; font-weight: bold; color: #1e293b; margin-top: 2px; }
        .stok-value { color: #1d4ed8; font-size: 22px; }
        
        .btn-main { background: #16a34a; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; box-shadow: 0 3px 8px rgba(22, 163, 74, 0.3); transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        
        #vcr-area { display: none; margin-top: 20px; padding-top: 15px; border-top: 2px dashed #cbd5e1; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; }
        
        .kode-container { display: flex; align-items: center; justify-content: center; gap: 8px; background: #fef2f2; border: 1px solid #fecaca; padding: 8px; border-radius: 8px; margin-top: 5px; }
        .kode { font-size: 22px; font-weight: bold; color: #dc2626; letter-spacing: 1px; }
        .btn-copy { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        /* Ringkasan Penjualan */
        .history-box { margin-top: 20px; font-size: 12px; color: #64748b; text-align: left; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .history-title { font-weight: bold; color: #334155; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .btn-reset { background: #ef4444; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Lapak Voucher Wi-Fi Fakri</h2>

    <!-- Ringkasan Stok & Omset -->
    <div class="grid-info">
        <div class="info-box stok-box">
            <div class="info-title">Sisa Stok Voucher</div>
            <div class="info-value stok-value"><span id="stok-count">0</span> Pcs</div>
        </div>
        <div class="info-box">
            <div class="info-title">Laku Bulan Ini</div>
            <div class="info-value"><span id="laku-bulan">0</span> pcs</div>
        </div>
        <div class="info-box">
            <div class="info-title">Omset Bulan Ini</div>
            <div class="info-value" style="color: #16a34a;">Rp <span id="omset-bulan">0</span></div>
        </div>
    </div>

    <button class="btn-main" onclick="ambilVoucher()">🎟️ AMBIL 1 VOUCHER (Rp 3.000)</button>

    <!-- Area Voucher Keluar -->
    <div id="vcr-area">
        <p style="margin:0; font-size:13px; color:#64748b;">Scan QR Code untuk Login:</p>
        <div id="qrcode"></div>
        <p style="margin:5px 0 0 0; font-size:12px; color:#64748b;">Kode Voucher:</p>
        <div class="kode-container">
            <span class="kode" id="kode-voucher">-</span>
            <button class="btn-copy" onclick="salinKode()">📋 Salin</button>
        </div>
    </div>

    <!-- Info Detail Transaksi -->
    <div class="history-box">
        <div class="history-title">
            <span>📊 Ringkasan Penjualan</span>
            <button class="btn-reset" onclick="resetBulan()">Reset Bulan Ini</button>
        </div>
        <div>Harga per voucher: <b>Rp 3.000</b></div>
        <div>Total Keseluruhan Terjual: <b id="total-terjual">0</b> pcs</div>
    </div>
</div>

<script>
    const SHEET_ID = '1HVV34-02cAfbKsDZeTPj2hDBxzVcQ8Yd9fhKvOZgPcI';
    const HARGA_VOUCHER = 3000;
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let daftarVoucher = [];

    async function loadVouchersFromSheets() {
        try {
            const response = await fetch(GVIZ_URL);
            const data = await response.text();
            
            daftarVoucher = data.split('\n')
                                .map(row => row.split(',')[0].replace(/"/g, '').trim())
                                .filter(v => v !== '');

            updateDashboard();
        } catch (error) {
            alert('Gagal memuat data! Pastikan Google Sheets diset Publik.');
        }
    }

    function getBulanSekarang() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth() + 1}`;
    }

    function updateDashboard() {
        let riwayat = JSON.parse(localStorage.getItem('vcr_riwayat_fakri') || '[]');
        let bulanIni = getBulanSekarang();

        let transaksiBulanIni = riwayat.filter(item => item.bulan === bulanIni);
        
        let sisaStok = daftarVoucher.length - riwayat.length;
        let totalLakuBulanIni = transaksiBulanIni.length;
        let totalOmsetBulanIni = totalLakuBulanIni * HARGA_VOUCHER;

        document.getElementById('stok-count').innerText = sisaStok > 0 ? sisaStok : 0;
        document.getElementById('laku-bulan').innerText = totalLakuBulanIni;
        document.getElementById('omset-bulan').innerText = totalOmsetBulanIni.toLocaleString('id-ID');
        document.getElementById('total-terjual').innerText = riwayat.length;
    }

    function ambilVoucher() {
        let riwayat = JSON.parse(localStorage.getItem('vcr_riwayat_fakri') || '[]');
        let terpakaiKode = riwayat.map(item => item.kode);

        let vcr = daftarVoucher.find(v => !terpakaiKode.includes(v));

        if (!vcr) {
            alert('Stok Voucher Habis! Silakan Minta Isi Ulang.');
            return;
        }

        document.getElementById('kode-voucher').innerText = vcr;
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: vcr, width: 160, height: 160 });
        document.getElementById('vcr-area').style.display = 'block';

        riwayat.push({
            kode: vcr,
            bulan: getBulanSekarang(),
            waktu: new Date().toLocaleString('id-ID')
        });

        localStorage.setItem('vcr_riwayat_fakri', JSON.stringify(riwayat));
        updateDashboard();
    }

    function salinKode() {
        let kode = document.getElementById('kode-voucher').innerText;
        if (kode && kode !== '-') {
            let tempInput = document.createElement("input");
            tempInput.value = kode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert('Kode voucher berhasil disalin: ' + kode);
        }
    }

    function resetBulan() {
        if (confirm('Yakin ingin mereset catatan penjualan bulan ini?')) {
            let riwayat = JSON.parse(localStorage.getItem('vcr_riwayat_fakri') || '[]');
            let bulanIni = getBulanSekarang();
            let riwayatBaru = riwayat.filter(item => item.bulan !== bulanIni);
            localStorage.setItem('vcr_riwayat_fakri', JSON.stringify(riwayatBaru));
            updateDashboard();
            alert('Catatan bulan ini berhasil direset!');
        }
    }

    loadVouchersFromSheets();
</script>

</body>
</html>
